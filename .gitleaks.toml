# Secret-scan configuration for CI (gitleaks v8.18.4). The default rules stay on for every file, including papers/.
# Every generic-api-key finding of the first CI scans (4,115) was a public identifier inside papers/: bibliography citation keys
# ("key": "Bowditch1998Topological"), Lean declaration names (OAI.*), kebab-case anchor ids, sha256 content hashes and paper coordinates.
# The allowlist skips only LINES of those forms (papers keep one JSON key per line); any other line, in papers/ or elsewhere, is scanned.
# Do not allowlist papers/ by path.
[extend]
useDefault = true

[allowlist]
description = "public identifiers in paper text: bibliography keys, Lean names, anchor ids, sha256 hashes, coordinates"
# Matched against the whole LINE (regexTarget = "line"), so only lines of these exact forms are skipped.
regexTarget = "line"
regexes = [
  '''"key"\s*:\s*"[A-Za-z][A-Za-z0-9_.'+-]{0,100}"''',
  '''\bOAI(\.[A-Za-z][A-Za-z0-9_]*)+\b''',
  '''\b[0-9a-f]{64}\b''',
  '''\bEN-[0-9]{3}-[0-9]{3}-[0-9]{4}-[0-9]-[0-9]{4}-[A-Z]{2}-T[0-9]-''',
  '''(access|anchor|key)[a-z_-]*"?\s*[:=]\s*"?[a-z]+(-[a-z]+)+"?''',
]
