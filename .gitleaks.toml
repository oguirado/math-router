# Secret-scan configuration for CI (gitleaks v8). The default rules stay on for every file.
# papers/ holds the 719 upstream mathematical papers with their sha256 content hashes and coordinates; every one of the
# 4,115 findings of the first CI scan was rule generic-api-key on those hashes inside papers/ (false positives).
# papers/ is still checked by the maintainer's release gate (privacy and secrets) before each release.
[extend]
useDefault = true

[allowlist]
description = "upstream paper text with content hashes"
paths = ['''^papers/''']
